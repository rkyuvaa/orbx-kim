services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kimdev123}
      POSTGRES_DB: ${POSTGRES_DB:-crmfinance}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kim} -d ${POSTGRES_DB:-crmfinance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Included for later phases (Celery job queue). Unused in Phase 1.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kim}:${POSTGRES_PASSWORD:-kimdev123}@db:5432/${POSTGRES_DB:-crmfinance}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-0123456789abcdef0123456789abcdef}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENABLE_SSL: ${ENABLE_SSL:-false}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Kim@2025}
      APP_ENV: ${APP_ENV:-development}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      api:
        condition: service_healthy

  # Optional Let's Encrypt provisioner. Enable by setting DOMAIN and ENABLE_SSL=true in .env.
  # certbot:
  #   image: certbot/certbot
  #   profiles: ["ssl"]
  #   volumes:
  #     - certs:/etc/letsencrypt
  #     - webroot:/var/www/certbot
  #   depends_on:
  #     - web

volumes:
  db_data:
  uploads_data:
  # certs:
  # webroot:
